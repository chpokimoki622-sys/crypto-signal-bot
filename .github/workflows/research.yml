name: Research

on:
  workflow_dispatch:
    inputs:
      universe:
        description: "small = малые монеты; или оставь пустым и задай symbols"
        default: "small"
        required: false
      symbols:
        description: "Список пар через запятую, например BTCUSDT,ETHUSDT"
        default: ""
        required: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r tools/requirements-research.txt

      - name: Run research
        run: python tools/research.py --universe "$UNIVERSE" --symbols "$SYMBOLS"
        env:
          UNIVERSE: ${{ inputs.universe }}
          SYMBOLS: ${{ inputs.symbols }}
