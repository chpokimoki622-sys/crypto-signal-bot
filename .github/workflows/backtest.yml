name: Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "За сколько дней проверить стратегию"
        default: "180"
        required: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run backtest
        run: python backtest.py "$DAYS"
        env:
          DAYS: ${{ inputs.days }}
