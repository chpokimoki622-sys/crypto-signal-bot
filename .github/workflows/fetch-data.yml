name: Fetch history

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Сколько дней истории скачать"
        default: "1095"
        required: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download candles
        run: python tools/fetch_data.py "$DAYS"
        env:
          DAYS: ${{ inputs.days }}

      - uses: actions/upload-artifact@v6
        with:
          name: history
          path: data/
          retention-days: 7
